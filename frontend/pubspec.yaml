name: devops_doctor
description: AI-powered DevOps log diagnosis tool powered by Amazon Bedrock.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Networking
  http: ^1.6.0

  # File picking
  file_picker: ^13.1.0

  # Localisation runtime
  intl: ^0.20.3

  # Fonts
  google_fonts: ^9.0.0

  # Animations
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Localisation code generation
  intl_utils: ^2.8.16

flutter:
  uses-material-design: true
